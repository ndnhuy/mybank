server:
  port: 8080

spring:
  application:
    name: mybank
  datasource:
    url: jdbc:mysql://${DOCKER_HOST_IP:localhost}:6603/mybankdb
    username: root
    password: root
    driver-class-name: com.mysql.jdbc.Driver

management:
  security:
    enabled: false
  server:
    port: 9001
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,250ms,500ms,1s,2s,5s
  endpoint:
    metrics:
      enabled: true
    prometheus:
      enabled: true
    health:
      show-details: always
      show-components: always
      probes:
        enabled: true
    shutdown:
      enabled: true
    info:
      env:
        enabled: true
      enabled: true
  endpoints:
    web:
      exposure:
        include: prometheus, metrics, info, health, shutdown, beans
